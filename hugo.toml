baseURL = 'https://manishbachhu.github.io/cowards-guide/'
locale = 'en-us'
title = "Coward's Guide"
theme = "dark-editor"
enableGitInfo = true

[params.homePage]
siteLongDescriptionTitle = "Summary"
siteLongDescription = """
Jay didn't choose to be summoned to another world — he just woke up in one, with nothing.
Here, a mysterious System grants everyone skills, classes, and magic... except him.
Cut off from every advantage this world runs on, Jay has to survive, adapt, and eventually thrive using nothing but wit, patience, and stubborn first-principles thinking.
No status screen. No shortcuts. No safety net.
The Coward's Guide to Beating the Demon Lord is the story of a hero who has to out-think a world that was never built to include him.
"""
